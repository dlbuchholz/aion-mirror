# Builds Aion and runs the tests on every push to develop and every pull request.
# Runs on the self-hosted runner (label linux-qt: Fedora with Qt 6, see the runner's Dockerfile).
name: Build and test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Only the latest commit of a branch (or pull request) matters: a new push cancels the run
# that is still going for an older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: linux-qt
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      # The job runs as another user than the checkout belongs to; without this git refuses
      # to read the repository and the About page would show the commit as "unknown"
      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows, cross-compiled with Fedora's MinGW Qt (same Qt version as the Linux job). Programs
  # built here are Windows .exe files, so the icon helper and the tests run under Wine.
  windows:
    name: Windows (MinGW)
    runs-on: linux-qt
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # mingw64-cmake is Fedora's wrapper that sets up the MinGW toolchain and Qt. QT_HOST_PATH
      # points at the Linux Qt, whose moc/rcc/uic run during the build.
      - name: Configure
        run: >
          mingw64-cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_HOST_PATH=/usr
          -DCMAKE_CROSSCOMPILING_EMULATOR=wine

      - name: Build
        run: cmake --build build-windows

      # ctest starts each test through the emulator (Wine). The Windows Qt plugins are only
      # needed here, so their path is set for this step and not for the Linux job. Under Wine Qt
      # draws real Windows windows, so xvfb-run gives Wine a virtual screen for tests that wait
      # for a window to appear. The default 640x480 screen is smaller than the test windows.
      - name: Test
        run: QT_PLUGIN_PATH="$MINGW_ROOT/lib/qt6/plugins" xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build-windows --output-on-failure

      # Under Wine without a console, Qt Test's output goes to the Windows debug output and not
      # into the log. Rerun each failed test with its results written to a file, and print that.
      - name: Details of failed tests
        if: failure()
        working-directory: build-windows
        run: |
          export QT_PLUGIN_PATH="$MINGW_ROOT/lib/qt6/plugins"
          for test in $(cut -d: -f2 Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            echo "::group::$test"
            xvfb-run -a -s "-screen 0 1920x1080x24" wine "./$test.exe" -o "$test.txt,txt" || true
            cat "$test.txt"
            echo "::endgroup::"
          done

      # A zip that runs on any Windows PC, for pushes to develop (not for pull requests)
      - name: Package
        id: package
        if: github.event_name == 'push'
        run: |
          zip=$(bash scripts/package-windows.sh build-windows dist)
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      # Start the packaged Aion with nothing but the package's own files: no MinGW folder on the
      # DLL path, no plugin path. A missing DLL or platform plugin fails here.
      - name: Check the package starts
        if: github.event_name == 'push'
        run: |
          output=$(WINEPATH= QT_PLUGIN_PATH= xvfb-run -a wine "dist/${{ steps.package.outputs.name }}/Aion.exe" --version)
          echo "$output"
          grep -q '^Aion ' <<< "$output"

      # Downloads as a zip of the package folder, from the run's page on Codeberg
      - name: Upload the package
        if: github.event_name == 'push'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/

      # The zip itself, for the release job
      - name: Hand the zip to the release job
        if: github.event_name == 'push'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-zip
          path: dist/${{ steps.package.outputs.name }}.zip

  # After both builds pass on a push to develop: replace the rolling "staging" pre-release, and
  # tag a new version from CMakeLists.txt with a draft release (scripts/publish-release.sh).
  release:
    name: Release
    needs: [linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: linux-qt
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Get the Windows zip
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: windows-zip
          path: dist

      # The run's own token, unless a RELEASE_TOKEN secret is set
      - name: Publish
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh dist/${{ needs.windows.outputs.package }}.zip
