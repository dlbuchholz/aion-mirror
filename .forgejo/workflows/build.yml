# Builds Liora and runs the tests on every push to develop and every pull request. Pushes build on
# Fedora and Windows only, unless they change the build (see the Plan job).
# Packages and publishes it (the "staging" pre-release) nightly when develop changed, and when
# started by hand ("Run workflow" on the Actions page), which can also prepare the version's draft.
# The Windows 7/8 package is built in nightly runs, with the draft, and when its box is ticked.
# Nightly and by hand, the tests also run once more with sanitizers (the sanitizers job).
# Runs on the self-hosted runner (label linux-qt: Fedora with Qt 6, see the runner's Dockerfile).
name: Build and test

# Changes to documentation alone (Markdown files, docs/) don't start a run: nothing they touch is
# built or tested. Anything else, like CMake files, migrations, assets, scripts and workflows, does.
on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [develop]
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '0 3 * * *'                  # UTC, on the default branch (develop)
  workflow_dispatch:
    inputs:
      draft:
        description: Also prepare the draft release of the version in CMakeLists.txt
        type: boolean
        default: false
      windows7:
        description: Also build the Windows 7/8 package (always built nightly and with the draft)
        type: boolean
        default: false

# Only the latest commit of a branch (or pull request) matters: a new push cancels the run
# that is still going for an older one. Publishing runs have their own group, so a push doesn't
# cancel the nightly packaging.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'publish' || 'test' }}
  cancel-in-progress: true

# ccache reuses compiler results from earlier runs, so only changed files are compiled again.
# Each building job keeps its own cache folder, which the runner saves on the VPS between runs
# (actions/cache). Without ccache in the image, the jobs build without it.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 300M

# Every job has a time limit (timeout-minutes) several times its normal length, publishing
# included, so a run that hangs frees the runner after minutes instead of hours.
jobs:
  # Decides what this run does: build (always, except a nightly run when staging already has this
  # commit or only documentation changed since), build with the older Qt versions too (see
  # older_qt below), publish (nightly and by hand) and prepare the draft (by hand, when ticked)
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      older_qt: ${{ steps.plan.outputs.older_qt }}
      publish: ${{ steps.plan.outputs.publish }}
      draft: ${{ steps.plan.outputs.draft }}
    steps:
      # The whole history with its tags, to find the commit staging was built from, or the
      # commit before a push
      - name: Check out
        if: github.event_name == 'schedule' || github.event_name == 'push'
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # A push builds on Fedora and Windows only, unless it changes what the Debian and AppImage
      # builds depend on (OLDER_QT_FILES). Those test the older Qt versions, so a newer Qt's
      # function shows up nightly at the latest. Pull requests, nightly and by hand build all.
      - name: Plan
        id: plan
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          BEFORE: ${{ github.event.before }}
          OLDER_QT_FILES: '(^|/)CMakeLists\.txt$|^scripts/package-(deb|appimage)\.sh$|^ci/images/(debian13|ubuntu22\.04)\.Dockerfile$|^\.forgejo/workflows/build\.yml$'
        run: |
          older_qt=true
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            # A new branch or a force push has no earlier commit here to compare with
            if ! git -c safe.directory='*' cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              echo "The commit before this push is unknown, building with the older Qt versions too"
            elif git -c safe.directory='*' diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$OLDER_QT_FILES"; then
              echo "This push changes the build, building with the older Qt versions too"
            else
              older_qt=false
            fi
          fi
          echo "older_qt=$older_qt" >> "$GITHUB_OUTPUT"

          build=true
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            staging=$(git -c safe.directory='*' rev-parse -q --verify 'refs/tags/staging^{commit}' || true)
            if [[ $staging == "$GITHUB_SHA" ]]; then
              echo "staging is at $GITHUB_SHA already, nothing to do"
              build=false
            elif [[ -n $staging ]] && ! git -c safe.directory='*' diff --name-only "$staging" "$GITHUB_SHA" \
                | grep -qvE '\.md$|^docs/'; then
              echo "Only documentation changed since staging ($staging), nothing to do"
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (RPM Build)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: linux-qt
    timeout-minutes: 15
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      # The job runs as another user than the checkout belongs to; without this git refuses
      # to read the repository and the About page would show the commit as "unknown"
      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIORA_USE_SYSTEM_QT=ON $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      # ccache's statistics show how much came from the cache
      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build
          ccache -s 2>/dev/null || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # An RPM for this Fedora release, in publishing runs. rpmbuild is installed here unless the
      # build image has it already.
      - name: Package
        id: package
        if: needs.plan.outputs.publish == 'true'
        run: |
          command -v rpmbuild > /dev/null || dnf -y -q install rpm-build
          rpm=$(bash scripts/package-rpm.sh build dist)
          echo "name=$(basename "$rpm" .rpm)" >> "$GITHUB_OUTPUT"

      # The plugins Qt loads at runtime aren't found by rpmbuild, so they're required by name in
      # CMakeLists.txt. A plugin that moved to another package fails here. Then install, start and
      # remove the package. This image has Qt's development packages too, so a real start on a
      # clean Fedora is still part of the release checks.
      - name: Check the RPM
        if: needs.plan.outputs.publish == 'true'
        run: |
          rpm_file="dist/${{ steps.package.outputs.name }}.rpm"
          rpm -qpl "$rpm_file"
          requires=$(rpm -qpR "$rpm_file")
          for plugin in sqldrivers/libqsqlite.so iconengines/libqsvgicon.so imageformats/libqsvg.so; do
            owner=$(rpm -qf --qf '%{NAME}' "/usr/lib64/qt6/plugins/$plugin")
            if ! grep -qxF "$owner" <<< "$requires"; then
              echo "$plugin is in $owner, which the RPM doesn't require" >&2
              exit 1
            fi
          done
          dnf -y -q install --nogpgcheck "$rpm_file"
          output=$(cd /tmp && QT_PLUGIN_PATH= Liora --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"
          dnf -y -q remove liora
          if command -v Liora > /dev/null; then
            echo "Removing the RPM left Liora behind" >&2
            exit 1
          fi

      # Kept for a day only: the release has it
      - name: Hand the RPM to the release job
        if: needs.plan.outputs.publish == 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: fedora-release
          retention-days: 1
          path: dist/${{ steps.package.outputs.name }}.rpm

  # The tests once more, built with AddressSanitizer and UndefinedBehaviorSanitizer
  # (LIORA_SANITIZERS): memory errors and undefined behaviour that a normal run passes by luck stop
  # the test with a report. A Debug build of its own, so only in publishing runs (nightly and by
  # hand). It doesn't hold up the release. Leaks aren't checked yet: Qt and fontconfig keep memory
  # until the program ends, which would bury Liora's own reports.
  sanitizers:
    name: Linux (sanitizers)
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: linux-qt
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Configure
        run: cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLIORA_USE_SYSTEM_QT=ON -DLIORA_SANITIZERS=ON $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build-sanitizers
          ccache -s 2>/dev/null || true

      # The tests run two to three times slower here, so they get more time
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure --timeout 300

  # Linux on Debian, with Debian's Qt (ci/images/debian13.Dockerfile). Also tests with an older
  # Qt version, so not on every push (older_qt).
  debian:
    name: Linux (DEB Build)
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.older_qt == 'true'
    runs-on: linux-debian
    timeout-minutes: 15
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-debian-${{ github.sha }}
          restore-keys: ccache-debian-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIORA_USE_SYSTEM_QT=ON $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build
          ccache -s 2>/dev/null || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A DEB for this Debian release, in publishing runs
      - name: Package
        id: package
        if: needs.plan.outputs.publish == 'true'
        run: |
          deb=$(bash scripts/package-deb.sh build dist)
          echo "name=$(basename "$deb" .deb)" >> "$GITHUB_OUTPUT"

      # The plugins Qt loads at runtime aren't found by dpkg-shlibdeps, so they're named in
      # CMakeLists.txt. A plugin that moved to another package fails here. Then install, start and
      # remove the package. This image has Qt's development packages too, so a real start on a
      # clean Debian is still part of the release checks.
      - name: Check the DEB
        if: needs.plan.outputs.publish == 'true'
        run: |
          deb_file="dist/${{ steps.package.outputs.name }}.deb"
          dpkg-deb -c "$deb_file"
          dpkg-deb -f "$deb_file" Depends
          depends=$(dpkg-deb -f "$deb_file" Depends | tr ',' '\n' | awk '{print $1}')
          for plugin in sqldrivers/libqsqlite.so iconengines/libqsvgicon.so imageformats/libqsvg.so; do
            owner=$(dpkg -S "/usr/lib/x86_64-linux-gnu/qt6/plugins/$plugin" | cut -d: -f1)
            if ! grep -qxF "$owner" <<< "$depends"; then
              echo "$plugin is in $owner, which the DEB doesn't depend on" >&2
              exit 1
            fi
          done
          apt-get install -y -q --no-install-recommends "./$deb_file"
          output=$(cd /tmp && QT_PLUGIN_PATH= Liora --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"
          apt-get remove -y -q liora
          if command -v Liora > /dev/null; then
            echo "Removing the DEB left Liora behind" >&2
            exit 1
          fi

      # Kept for a day only: the release has it
      - name: Hand the DEB to the release job
        if: needs.plan.outputs.publish == 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: debian-release
          retention-days: 1
          path: dist/${{ steps.package.outputs.name }}.deb

  # Linux as an AppImage, on Ubuntu 22.04 with the official Qt (ci/images/ubuntu22.04.Dockerfile),
  # so it runs on older distributions too. Also tests with that Qt version, so not on every push
  # (older_qt).
  appimage:
    name: Linux (AppImage)
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.older_qt == 'true'
    runs-on: linux-appimage
    timeout-minutes: 15
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build
          ccache -s 2>/dev/null || true

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        id: package
        if: needs.plan.outputs.publish == 'true'
        run: |
          appimage=$(bash scripts/package-appimage.sh build dist)
          echo "name=$(basename "$appimage" .AppImage)" >> "$GITHUB_OUTPUT"

      # Start the AppImage outside the build folder, so only its own libraries are used
      - name: Check the AppImage starts
        if: needs.plan.outputs.publish == 'true'
        run: |
          output=$(cd /tmp && "$GITHUB_WORKSPACE/dist/${{ steps.package.outputs.name }}.AppImage" --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"

      # Kept for a day only: the release has it
      - name: Hand the AppImage to the release job
        if: needs.plan.outputs.publish == 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: linux-release
          retention-days: 1
          path: dist/${{ steps.package.outputs.name }}.AppImage

  # Windows, cross-compiled with Fedora's MinGW Qt (same Qt version as the Linux job). Programs
  # built here are Windows .exe files, so the icon helper and the tests run under Wine.
  windows:
    name: Windows (MinGW)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: linux-qt
    timeout-minutes: 20
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      # mingw64-cmake is Fedora's wrapper that sets up the MinGW toolchain and Qt. QT_HOST_PATH
      # points at the Linux Qt, whose moc/rcc/uic run during the build.
      - name: Configure
        run: >
          mingw64-cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_HOST_PATH=/usr
          -DCMAKE_CROSSCOMPILING_EMULATOR=wine
          $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build-windows
          ccache -s 2>/dev/null || true

      # ctest starts each test through the emulator (Wine). The Windows Qt plugins are only
      # needed here, so their path is set for this step and not for the Linux job. Under Wine Qt
      # draws real Windows windows, so xvfb-run gives Wine a virtual screen for tests that wait
      # for a window to appear. The default 640x480 screen is smaller than the test windows.
      # Wine starts its Windows background programs (services, explorer, ...) with the first program
      # and stops them after the last one. Started by a test, they keep its output open while they
      # shut down, and ctest waits for that: about 5 s per test. So Wine is started once before
      # ctest, by one test with its output going nowhere, and kept running (wineserver -p) until
      # the tests are done. --timeout ends a test that hangs anyway.
      - name: Test
        run: |
          export QT_PLUGIN_PATH="$MINGW_ROOT/lib/qt6/plugins"
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            wineserver -p > /dev/null 2>&1 < /dev/null
            trap "wineserver -k" EXIT
            wine build-windows/test_money.exe > /dev/null 2>&1 < /dev/null
            ctest --test-dir build-windows --output-on-failure --timeout 120'

      # Under Wine without a console, Qt Test's output goes to the Windows debug output and not
      # into the log. Rerun each failed test with its results written to a file, and print that.
      - name: Details of failed tests
        if: failure()
        working-directory: build-windows
        run: |
          export QT_PLUGIN_PATH="$MINGW_ROOT/lib/qt6/plugins"
          for test in $(cut -d: -f2 Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            echo "::group::$test"
            xvfb-run -a -s "-screen 0 1920x1080x24" wine "./$test.exe" -o "$test.txt,txt" || true
            cat "$test.txt"
            echo "::endgroup::"
          done

      # A zip that runs on any Windows PC, in publishing runs (nightly and by hand)
      - name: Package
        id: package
        if: needs.plan.outputs.publish == 'true'
        run: |
          zip=$(bash scripts/package-windows.sh build-windows dist)
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      # Start the packaged Liora with nothing but the package's own files: no MinGW folder on the
      # DLL path, no plugin path. A missing DLL or platform plugin fails here.
      - name: Check the package starts
        if: needs.plan.outputs.publish == 'true'
        run: |
          output=$(WINEPATH= QT_PLUGIN_PATH= xvfb-run -a wine "dist/${{ steps.package.outputs.name }}/Liora.exe" --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"

      # The installer (installer/liora.nsi), from the packaged folder. NSIS comes from Fedora; it's
      # installed here unless the build image has it already.
      - name: Build the installer
        if: needs.plan.outputs.publish == 'true'
        run: |
          command -v makensis > /dev/null || dnf -y -q install mingw32-nsis
          name=${{ steps.package.outputs.name }}
          version=$(sed -n 's/^project([A-Za-z]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          makensis -V2 -DVERSION="$version" -DSOURCE="$PWD/dist/$name" \
                   -DICON="$PWD/build-windows/generated/liora.ico" -DOUTFILE="$PWD/dist/$name-setup.exe" \
                   installer/liora.nsi

      # Install silently, start the installed Liora with only its own files, uninstall, and check
      # that the folder is gone. wineserver -w waits for the uninstaller, which runs from a copy.
      - name: Check the installer
        if: needs.plan.outputs.publish == 'true'
        run: |
          folder="$WINEPREFIX/drive_c/LioraTest/Liora"
          xvfb-run -a wine "dist/${{ steps.package.outputs.name }}-setup.exe" /S '/D=C:\LioraTest\Liora'
          wineserver -w
          output=$(WINEPATH= QT_PLUGIN_PATH= xvfb-run -a wine "$folder/Liora.exe" --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"
          xvfb-run -a wine "$folder/Uninstall.exe" /S
          wineserver -w
          if [[ -e $folder ]]; then
            echo "The uninstaller left $folder behind" >&2
            exit 1
          fi

      # The zip and the installer, for the release job. Kept for a day only: the release has them.
      - name: Hand the files to the release job
        if: needs.plan.outputs.publish == 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-release
          retention-days: 1
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}-setup.exe

  # Windows 7/8, cross-compiled with Qt 6.8.5 and the qt6windows7 patches
  # (ci/images/fedora44-win7.Dockerfile). Not first-class support: built only in publishing runs
  # that are nightly or prepare the draft, or when started by hand with its box ticked, not on
  # pushes. A failure doesn't fail the run or hold up the release, which then goes out without
  # these files.
  windows7:
    name: Windows 7/8 (MinGW, Qt 6.8)
    needs: plan
    if: >
      needs.plan.outputs.build == 'true' && needs.plan.outputs.publish == 'true'
      && (github.event_name == 'schedule' || needs.plan.outputs.draft == 'true'
          || github.event.inputs.windows7 == 'true')
    runs-on: linux-qt-win7
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Allow git in the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the compiler cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows7-${{ github.sha }}
          restore-keys: ccache-windows7-

      # qt-cmake is the Windows Qt's own CMake, which sets up the cross build and the Linux Qt
      # (QT_HOST_PATH) whose moc/rcc/uic run during the build
      - name: Configure
        run: >
          "$QT_WIN7_ROOT/bin/qt-cmake" -S . -B build-win7 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CROSSCOMPILING_EMULATOR=wine
          $(command -v ccache > /dev/null && echo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)

      - name: Build
        run: |
          ccache -z > /dev/null 2>&1 || true
          cmake --build build-win7
          ccache -s 2>/dev/null || true

      # As in the windows job. The image points Wine and Qt at the Windows 7 Qt. Wine passes for
      # Windows 10, so this tests Liora with Qt 6.8, not on Windows 7.
      - name: Test
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            wineserver -p > /dev/null 2>&1 < /dev/null
            trap "wineserver -k" EXIT
            wine build-win7/test_money.exe > /dev/null 2>&1 < /dev/null
            ctest --test-dir build-win7 --output-on-failure --timeout 120'

      - name: Details of failed tests
        if: failure()
        working-directory: build-win7
        run: |
          for test in $(cut -d: -f2 Testing/Temporary/LastTestsFailed.log 2>/dev/null); do
            echo "::group::$test"
            xvfb-run -a -s "-screen 0 1920x1080x24" wine "./$test.exe" -o "$test.txt,txt" || true
            cat "$test.txt"
            echo "::endgroup::"
          done

      - name: Package
        id: package
        run: |
          zip=$(QT_ROOT="$QT_WIN7_ROOT" PACKAGE_SUFFIX=windows7-x64 bash scripts/package-windows.sh build-win7 dist)
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      # Every Windows function the package calls must be on Windows 7 SP1 (ci/win7-exports)
      - name: Check the package's imports
        run: bash scripts/check-win7-imports.sh "dist/${{ steps.package.outputs.name }}"

      - name: Check the package starts
        run: |
          output=$(WINEPATH= QT_PLUGIN_PATH= xvfb-run -a wine "dist/${{ steps.package.outputs.name }}/Liora.exe" --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"

      - name: Build the installer
        run: |
          name=${{ steps.package.outputs.name }}
          version=$(sed -n 's/^project([A-Za-z]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          makensis -V2 -DVERSION="$version" -DSOURCE="$PWD/dist/$name" \
                   -DICON="$PWD/build-win7/generated/liora.ico" -DOUTFILE="$PWD/dist/$name-setup.exe" \
                   installer/liora-win7.nsi

      - name: Check the installer
        run: |
          folder="$WINEPREFIX/drive_c/LioraTest/Liora-Win7"
          xvfb-run -a wine "dist/${{ steps.package.outputs.name }}-setup.exe" /S '/D=C:\LioraTest\Liora-Win7'
          wineserver -w
          output=$(WINEPATH= QT_PLUGIN_PATH= xvfb-run -a wine "$folder/Liora.exe" --version)
          echo "$output"
          grep -q '^Liora ' <<< "$output"
          xvfb-run -a wine "$folder/Uninstall.exe" /S
          wineserver -w
          if [[ -e $folder ]]; then
            echo "The uninstaller left $folder behind" >&2
            exit 1
          fi

      # For the release job, and for trying them on Windows 7/8 from a run that doesn't publish
      # (one on another branch than develop): kept for a week.
      - name: Hand the files to the release job
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows7-release
          retention-days: 7
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/${{ steps.package.outputs.name }}-setup.exe

  # After all builds pass in a publishing run on develop: replace the rolling "staging"
  # pre-release, and, when ticked, tag a new version from CMakeLists.txt with a draft release
  # (scripts/publish-release.sh). The Windows 7/8 files go along when that job built them; it
  # failing or not running doesn't hold up the release (always(), with the other jobs checked).
  release:
    name: Release
    needs: [plan, linux, debian, appimage, windows, windows7]
    if: >
      always() && needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/develop'
      && needs.linux.result == 'success' && needs.debian.result == 'success'
      && needs.appimage.result == 'success' && needs.windows.result == 'success'
    runs-on: linux-qt
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Get the Windows 7/8 files
        if: needs.windows7.outputs.package != ''
        continue-on-error: true
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: windows7-release
          path: dist

      - name: Get the Windows files
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: windows-release
          path: dist

      - name: Get the AppImage
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: linux-release
          path: dist

      - name: Get the RPM
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: fedora-release
          path: dist

      - name: Get the DEB
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: debian-release
          path: dist

      # The run's own token, unless a RELEASE_TOKEN secret is set. The Windows 7/8 files only when
      # both arrived.
      - name: Publish
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PREPARE_DRAFT: ${{ needs.plan.outputs.draft }}
          WINDOWS7: ${{ needs.windows7.outputs.package }}
        run: |
          files=(dist/${{ needs.windows.outputs.package }}.zip
                 dist/${{ needs.windows.outputs.package }}-setup.exe
                 dist/${{ needs.appimage.outputs.package }}.AppImage
                 dist/${{ needs.linux.outputs.package }}.rpm
                 dist/${{ needs.debian.outputs.package }}.deb)
          if [[ -n $WINDOWS7 && -f dist/$WINDOWS7.zip && -f dist/$WINDOWS7-setup.exe ]]; then
            files+=("dist/$WINDOWS7.zip" "dist/$WINDOWS7-setup.exe")
          else
            echo "Publishing without the Windows 7/8 files"
          fi
          bash scripts/publish-release.sh "${files[@]}"
